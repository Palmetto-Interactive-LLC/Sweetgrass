name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    permissions:
      contents: read
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Check PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          set -euo pipefail
          title="${PR_TITLE:-}"
          if test -z "$title"; then title="${MERGE_MESSAGE:-}"; title="${title%%$'\n'*}"; fi
          if test -z "$title"; then
            echo "No pull request or merge queue title on this event. Nothing to check."
            exit 0
          fi
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/,-]+\))?!?: [^ ].*$'
          if [[ "$title" =~ $re ]] || [[ "$title" == 'Revert "'* ]]; then
            echo "Title follows Conventional Commits."
          else
            echo "::error title=Title::The title must look like 'type(scope): subject'. Types: feat fix docs style refactor perf test build ci chore revert. Scope is optional; '!' marks a breaking change."
            printf 'Got: %s\n' "$title"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - run: make ci
