name: Release Build Test

on:
  pull_request:

permissions: {}

jobs:
  build:
    name: build-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: beads-server-linux-arm64
          - target: x86_64-unknown-linux-gnu
            artifact: beads-server-linux-x64
            cross-packages: gcc-x86-64-linux-gnu libc6-dev-amd64-cross
            linker-env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
            linker: x86_64-linux-gnu-gcc

    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross compiler
        if: matrix.cross-packages != ''
        env:
          PACKAGES: ${{ matrix.cross-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES

      - name: Build server
        working-directory: server
        env:
          TARGET: ${{ matrix.target }}
          LINKER_ENV: ${{ matrix.linker-env }}
          LINKER: ${{ matrix.linker }}
        run: |
          if [ -n "$LINKER_ENV" ]; then export "$LINKER_ENV=$LINKER" CC_x86_64_unknown_linux_gnu="$LINKER"; fi
          cargo build --release --target "$TARGET"

      - name: Copy binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          cp "server/target/$TARGET/release/beads-server" "$ARTIFACT"
