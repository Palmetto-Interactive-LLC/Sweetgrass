name: Release build verify (throwaway)

# Throwaway: runs the Release build matrix's Linux x64 and Windows legs on the
# org CodeBuild runner. Never merged.

on:
  pull_request:

permissions: {}

jobs:
  build:
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-7.0-medium
            target: x86_64-unknown-linux-gnu
            artifact: beads-server-linux-x64
            binary: beads-server
          - os: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}-windows-3.0-medium
            target: x86_64-pc-windows-msvc
            artifact: beads-server-win32-x64.exe
            binary: beads-server.exe

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # The CodeBuild Windows container cannot create rustup's component
      # directories under the ContainerAdministrator profile (os error 161),
      # so keep rustup and cargo in the job's temp directory there.
      - name: Rust homes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:RUNNER_TEMP\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Toolchain probe (throwaway)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command bash, link.exe, cl.exe -ErrorAction SilentlyContinue | Format-Table Name, Source
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio' -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio\2019' -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio\2019\*\VC\Tools\MSVC' -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Lib' -ErrorAction SilentlyContinue | Select-Object Name
          & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -products * -format text -property installationPath

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build server
        working-directory: server
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"

      - name: Copy binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          cp "server/target/$TARGET/release/$BINARY" "$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

