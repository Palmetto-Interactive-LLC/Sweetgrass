name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v1.0.0"
        required: true
        type: string

permissions: {}

# The release and npm publish jobs and the Linux x64 build run on the org
# CodeBuild runner (codebuild-pi-actions). The macOS and Windows builds are the
# Palmetto CI standard's exception and stay on GitHub-hosted runners, which are
# free for this public repo: CodeBuild has macOS only on reserved Mac fleets,
# and its Windows image has no MSVC C++ build tools (verified in #41). The four
# assets below are exactly the set npm/scripts/postinstall.js downloads; keep
# them in step with its platformMap.
jobs:
  build:
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: beads-server-darwin-arm64
            binary: beads-server
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: beads-server-darwin-x64
            binary: beads-server
          - os: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-7.0-medium
            target: x86_64-unknown-linux-gnu
            artifact: beads-server-linux-x64
            binary: beads-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: beads-server-win32-x64.exe
            binary: beads-server.exe

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build server
        working-directory: server
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"

      - name: Copy binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          cp "server/target/$TARGET/release/$BINARY" "$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: release
    needs: build
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          name: ${{ inputs.version || github.ref_name }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: release/*
          generate_release_notes: true

  publish-npm:
    name: publish-npm
    needs: release
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          VERSION="${VERSION#v}"
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
