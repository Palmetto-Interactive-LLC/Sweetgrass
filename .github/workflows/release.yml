name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v1.0.0"
        required: true
        type: string

permissions: {}

# Every job runs on the GitHub-hosted ARM runner. That runner cannot produce
# macOS or Windows binaries (no Apple SDK on Linux), so this release ships the
# two Linux binaries only until Daytona v2 arm64 widens the fleet.
jobs:
  build:
    name: build-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: beads-server-linux-arm64
          - target: x86_64-unknown-linux-gnu
            artifact: beads-server-linux-x64
            cross-packages: gcc-x86-64-linux-gnu libc6-dev-amd64-cross
            linker-env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
            linker: x86_64-linux-gnu-gcc

    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross compiler
        if: matrix.cross-packages != ''
        env:
          PACKAGES: ${{ matrix.cross-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES

      - name: Build server
        working-directory: server
        env:
          TARGET: ${{ matrix.target }}
          LINKER_ENV: ${{ matrix.linker-env }}
          LINKER: ${{ matrix.linker }}
        run: |
          if [ -n "$LINKER_ENV" ]; then export "$LINKER_ENV=$LINKER" CC_x86_64_unknown_linux_gnu="$LINKER"; fi
          cargo build --release --target "$TARGET"

      - name: Copy binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          cp "server/target/$TARGET/release/beads-server" "$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: release
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          name: ${{ inputs.version || github.ref_name }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: release/*
          generate_release_notes: true

  publish-npm:
    name: publish-npm
    needs: release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          VERSION="${VERSION#v}"
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
