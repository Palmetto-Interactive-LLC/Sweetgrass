name: PI Checks

on:
  pull_request:

permissions: {}

concurrency:
  group: pi-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@9d1ad406a62908ebf904a18613371ea669e04d33 # v1
    with:
      stack: node
      node-version: "24"
      # Lint and typecheck run as the stack defaults. The build phase runs the
      # static export, then the Rust server: rust-embed compiles ../out into
      # the binary, so the frontend build has to finish before any cargo call.
      build-command: >-
        npm run build &&
        cd server &&
        cargo clippy --release &&
        cargo test --release
